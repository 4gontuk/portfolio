<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <text x="440" y="34" font-size="16" font-weight="700" fill="#e9eef5" text-anchor="middle">how an audit with me runs · five steps</text>

  <!-- timeline -->
  <line x1="100" y1="108" x2="780" y2="108" stroke="url(#tl)" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="100" cy="108" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
  <text x="100" y="113" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">1</text>
  <text x="100" y="78" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Scope</text>
  <text x="100" y="142" font-size="12" fill="#b0bcc9" text-anchor="middle">map the attack</text>
  <text x="100" y="160" font-size="12" fill="#b0bcc9" text-anchor="middle">surface</text>
  <text x="100" y="186" font-size="12" font-weight="700" fill="#3fb950" text-anchor="middle">day 0</text>

  <!-- step 2 -->
  <circle cx="270" cy="108" r="16" fill="#0d1117" stroke="#a371f7" stroke-width="2.5"/>
  <text x="270" y="113" font-size="14" font-weight="700" fill="#c4a5ff" text-anchor="middle">2</text>
  <text x="270" y="78" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Deep read</text>
  <text x="270" y="142" font-size="12" fill="#b0bcc9" text-anchor="middle">every line,</text>
  <text x="270" y="160" font-size="12" fill="#b0bcc9" text-anchor="middle">every flow</text>
  <text x="270" y="186" font-size="12" font-weight="700" fill="#a371f7" text-anchor="middle">days 1-5</text>

  <!-- step 3 -->
  <circle cx="440" cy="108" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="440" y="113" font-size="14" font-weight="700" fill="#79c0ff" text-anchor="middle">3</text>
  <text x="440" y="78" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Attack</text>
  <text x="440" y="142" font-size="12" fill="#b0bcc9" text-anchor="middle">foundry PoCs</text>
  <text x="440" y="160" font-size="12" fill="#b0bcc9" text-anchor="middle">for every bug</text>
  <text x="440" y="186" font-size="12" font-weight="700" fill="#58a6ff" text-anchor="middle">days 5-9</text>

  <!-- step 4 -->
  <circle cx="610" cy="108" r="16" fill="#0d1117" stroke="#e3b341" stroke-width="2.5"/>
  <text x="610" y="113" font-size="14" font-weight="700" fill="#e3b341" text-anchor="middle">4</text>
  <text x="610" y="78" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Report</text>
  <text x="610" y="142" font-size="12" fill="#b0bcc9" text-anchor="middle">severity rated,</text>
  <text x="610" y="160" font-size="12" fill="#b0bcc9" text-anchor="middle">plain words</text>
  <text x="610" y="186" font-size="12" font-weight="700" fill="#e3b341" text-anchor="middle">within 48h</text>

  <!-- step 5 -->
  <circle cx="780" cy="108" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
  <text x="780" y="113" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">5</text>
  <text x="780" y="78" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Recheck</text>
  <text x="780" y="142" font-size="12" fill="#b0bcc9" text-anchor="middle">I verify</text>
  <text x="780" y="160" font-size="12" fill="#b0bcc9" text-anchor="middle">your fixes</text>
  <text x="780" y="186" font-size="12" font-weight="700" fill="#3fb950" text-anchor="middle">free</text>
</svg>
