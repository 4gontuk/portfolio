<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="doc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
  </defs>

  <!-- report card -->
  <rect x="2" y="2" width="876" height="296" rx="14" fill="url(#doc-bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="20" y="20" width="5" height="44" rx="2.5" fill="#e74c3c"/>

  <!-- header row -->
  <rect x="36" y="26" width="52" height="20" rx="5" fill="#e74c3c"/>
  <text x="62" y="41" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HIGH</text>
  <text x="844" y="41" font-size="12" fill="#7d8790" text-anchor="end">real finding · public record · olas · code4rena</text>

  <!-- title -->
  <text x="36" y="76" font-size="17" font-weight="700" fill="#f0f6fc">Insolvency via cross-service reentrancy in StakingBase._withdraw</text>

  <!-- what happens -->
  <text x="36" y="112" font-size="12" font-weight="700" fill="#4ade80">WHAT HAPPENS</text>
  <text x="36" y="134" font-size="14" fill="#d7dde5">An attacker re-enters a different service while a withdrawal is still in</text>
  <text x="36" y="154" font-size="14" fill="#d7dde5">flight and walks away with more than their share. The pool turns insolvent.</text>

  <!-- poc -->
  <text x="36" y="192" font-size="12" font-weight="700" fill="#4ade80">PROOF OF CONCEPT</text>
  <text x="36" y="214" font-size="14" fill="#d7dde5">✓ Foundry test. One command, reproducible on a mainnet fork.</text>

  <!-- fix -->
  <text x="36" y="250" font-size="12" font-weight="700" fill="#4ade80">THE FIX</text>
  <text x="36" y="272" font-size="14" fill="#d7dde5">Cross-service reentrancy guard + checks-effects-interactions ordering.</text>
</svg>
