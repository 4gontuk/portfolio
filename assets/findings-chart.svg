<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <rect x="1.5" y="1.5" width="877" height="247" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <defs>
    <filter id="ng" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- donut background ring -->
  <circle cx="160" cy="125" r="78" fill="none" stroke="#161b22" stroke-width="26"/>

  <!-- segments: C=490.09, total=129 -->
  <!-- critical: 1 -> 3.80 -->
  <circle cx="160" cy="125" r="78" fill="none" stroke="#c9143c" stroke-width="26"
    stroke-dasharray="3.80 486.29" stroke-dashoffset="0" transform="rotate(-90 160 125)"/>
  <!-- high: 42 -> 159.67 -->
  <circle cx="160" cy="125" r="78" fill="none" stroke="#f0883e" stroke-width="26"
    stroke-dasharray="159.67 330.42" stroke-dashoffset="-3.80" transform="rotate(-90 160 125)"/>
  <!-- medium: 54 -> 205.32 -->
  <circle cx="160" cy="125" r="78" fill="none" stroke="#e3b341" stroke-width="26"
    stroke-dasharray="205.32 284.77" stroke-dashoffset="-163.47" transform="rotate(-90 160 125)"/>
  <!-- private: 32 -> 121.30 -->
  <circle cx="160" cy="125" r="78" fill="none" stroke="#a371f7" stroke-width="26"
    stroke-dasharray="121.30 368.79" stroke-dashoffset="-368.79" transform="rotate(-90 160 125)"/>

  <!-- center label -->
  <text x="160" y="120" font-size="32" font-weight="700" fill="#f0f6fc" text-anchor="middle" filter="url(#ng)">125+</text>
  <text x="160" y="146" font-size="12" fill="#b0bcc9" text-anchor="middle">valid findings</text>

  <!-- legend -->
  <circle cx="330" cy="62" r="7" fill="#c9143c"/>
  <text x="350" y="67" font-size="15" fill="#f0f6fc">Critical <tspan fill="#9da9b6">1 · HackenProof</tspan></text>

  <circle cx="330" cy="102" r="7" fill="#f0883e"/>
  <text x="350" y="107" font-size="15" fill="#f0f6fc">High severity <tspan fill="#9da9b6">42+ · public contests</tspan></text>

  <circle cx="330" cy="142" r="7" fill="#e3b341"/>
  <text x="350" y="147" font-size="15" fill="#f0f6fc">Medium severity <tspan fill="#9da9b6">54+ · public contests</tspan></text>

  <circle cx="330" cy="182" r="7" fill="#a371f7"/>
  <text x="350" y="187" font-size="15" fill="#f0f6fc">Private engagements <tspan fill="#9da9b6">32+ · Sherlock AE</tspan></text>

  <text x="330" y="224" font-size="12" fill="#7d8790">counts verified on public platform profiles · nov 2026</text>
</svg>
