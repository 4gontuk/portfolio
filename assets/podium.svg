<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <rect x="1.5" y="1.5" width="877" height="297" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <defs>
    <filter id="ng" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd943"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#9da9b6"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <line x1="110" y1="272" x2="770" y2="272" stroke="#21262d" stroke-width="2"/>

  <!-- center pedestal: Covenant -->
  <rect x="390" y="120" width="100" height="152" rx="6" fill="#161d29" stroke="#d4af37" stroke-width="1.5"/>
  <text x="440" y="172" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="middle">1st</text>
  <text x="440" y="200" font-size="11" fill="#b0bcc9" text-anchor="middle">Code4rena</text>
  <!-- gold medal -->
  <circle cx="440" cy="64" r="26" fill="url(#gold)" stroke="#b8860b" stroke-width="3" filter="url(#ng)"/>
  <text x="440" y="72" font-size="22" font-weight="700" fill="#6b4c00" text-anchor="middle">1</text>
  <text x="440" y="112" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Covenant</text>

  <!-- left pedestal: Morpho Midnight -->
  <rect x="175" y="160" width="100" height="112" rx="6" fill="#161d29" stroke="#9ea7b3" stroke-width="1.5"/>
  <text x="225" y="208" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">2nd</text>
  <text x="225" y="234" font-size="11" fill="#b0bcc9" text-anchor="middle">Cantina · $5,000</text>
  <!-- silver medal -->
  <circle cx="225" cy="102" r="21" fill="url(#silver)" stroke="#8a95a3" stroke-width="3" filter="url(#ng)"/>
  <text x="225" y="109" font-size="18" font-weight="700" fill="#39424d" text-anchor="middle">2</text>
  <text x="225" y="148" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">Morpho Midnight</text>

  <!-- right pedestal: Sequence Rails -->
  <rect x="605" y="160" width="100" height="112" rx="6" fill="#161d29" stroke="#9ea7b3" stroke-width="1.5"/>
  <text x="655" y="208" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">2nd</text>
  <text x="655" y="234" font-size="11" fill="#b0bcc9" text-anchor="middle">Code4rena</text>
  <!-- silver medal -->
  <circle cx="655" cy="102" r="21" fill="url(#silver)" stroke="#8a95a3" stroke-width="3" filter="url(#ng)"/>
  <text x="655" y="109" font-size="18" font-weight="700" fill="#39424d" text-anchor="middle">2</text>
  <text x="655" y="148" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">Sequence Rails</text>
</svg>
