<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <filter id="ng" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card 1: audits -->
  <rect x="2" y="3" width="210" height="126" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="18" y="19" width="30" height="5" rx="2.5" fill="#3fb950"/>
  <text x="18" y="76" font-size="32" font-weight="700" fill="#4ade80" filter="url(#ng)">60+</text>
  <text x="18" y="102" font-size="13" fill="#b0bcc9">audit contests</text>
  <!-- ghost magnifier -->
  <g opacity="0.14" stroke="#3fb950" stroke-width="3" fill="none">
    <circle cx="182" cy="94" r="16"/>
    <line x1="194" y1="106" x2="206" y2="118"/>
  </g>

  <!-- card 2: findings -->
  <rect x="224" y="3" width="210" height="126" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="240" y="19" width="30" height="5" rx="2.5" fill="#f0883e"/>
  <text x="240" y="76" font-size="32" font-weight="700" fill="#ffa657" filter="url(#ng)">125+</text>
  <text x="240" y="102" font-size="13" fill="#b0bcc9">valid findings</text>
  <!-- ghost bug -->
  <g opacity="0.14" stroke="#f0883e" stroke-width="3" fill="none">
    <ellipse cx="294" cy="100" rx="13" ry="17"/>
    <line x1="281" y1="94" x2="270" y2="88"/>
    <line x1="281" y1="104" x2="270" y2="104"/>
    <line x1="281" y1="114" x2="270" y2="120"/>
    <line x1="307" y1="94" x2="318" y2="88"/>
    <line x1="307" y1="104" x2="318" y2="104"/>
    <line x1="307" y1="114" x2="318" y2="120"/>
  </g>

  <!-- card 3: paid -->
  <rect x="446" y="3" width="210" height="126" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="462" y="19" width="30" height="5" rx="2.5" fill="#e3b341"/>
  <text x="462" y="76" font-size="32" font-weight="700" fill="#e3b341" filter="url(#ng)">$32K+</text>
  <text x="462" y="102" font-size="13" fill="#b0bcc9">paid out</text>
  <!-- ghost coin -->
  <g opacity="0.14" stroke="#e3b341" stroke-width="3" fill="none">
    <circle cx="520" cy="100" r="18"/>
    <text x="520" y="107" font-size="18" font-weight="700" fill="#e3b341" stroke="none" text-anchor="middle">$</text>
  </g>

  <!-- card 4: top-10 -->
  <rect x="668" y="3" width="210" height="126" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="684" y="19" width="30" height="5" rx="2.5" fill="#a371f7"/>
  <text x="684" y="76" font-size="32" font-weight="700" fill="#c4a5ff" filter="url(#ng)">14x</text>
  <text x="684" y="102" font-size="13" fill="#b0bcc9">top-10 finishes</text>
  <!-- ghost medal -->
  <g opacity="0.14" stroke="#a371f7" stroke-width="3" fill="none">
    <circle cx="834" cy="104" r="14"/>
    <path d="M 826 92 L 820 78 M 842 92 L 848 78"/>
  </g>
</svg>
