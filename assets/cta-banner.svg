<svg xmlns="http://www.w3.org/2000/svg" width="880" height="110" viewBox="0 0 880 110" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="cta-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="ng" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="876" height="106" rx="14" fill="url(#cta-bg)" stroke="#2ea043" stroke-width="1.5"/>

  <!-- pulsing status dot -->
  <circle cx="40" cy="42" r="6" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="48" font-size="20" font-weight="700" fill="#f0f6fc">OPEN FOR PRIVATE AUDITS</text>
  <text x="60" y="78" font-size="13" fill="#b0bcc9">foundry PoCs · plain reports · fix recheck · fast replies · DM <tspan fill="#4ade80">@Ag0ntuk</tspan> on telegram</text>

  <!-- right side -->
  <text x="820" y="48" font-size="15" font-weight="700" fill="#4ade80" text-anchor="end" filter="url(#ng)">contact.agontuk@gmail.com</text>
  <text x="820" y="78" font-size="12" fill="#7d8790" text-anchor="end">$ mail -s audit &lt;your-protocol&gt;</text>
  <rect x="826" y="34" width="9" height="17" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
